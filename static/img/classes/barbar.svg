<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="barbarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="70%" stop-color="#1c0709" />
      <stop offset="100%" stop-color="#0b0203" />
    </radialGradient>
    <linearGradient id="axeBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="bronzeTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#barbarBg)" stroke="#b91c1c" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
  
  <!-- Crossed Battleaxes -->
  <g transform="translate(100, 100)" filter="url(#glow)">
    <!-- Axe Shaft 1 -->
    <rect x="-6" y="-70" width="12" height="140" rx="3" fill="#5c2c16" transform="rotate(45)" stroke="#2b1106" stroke-width="2" />
    <!-- Axe Shaft 2 -->
    <rect x="-6" y="-70" width="12" height="140" rx="3" fill="#5c2c16" transform="rotate(-45)" stroke="#2b1106" stroke-width="2" />
    
    <!-- Left Axe Head -->
    <g transform="rotate(45) translate(0, -45)">
      <!-- Blade Left -->
      <path d="M-6, -10 C-35, -28 -48, 5 -10, 22 L-6, 12 Z" fill="url(#axeBlade)" stroke="#fee2e2" stroke-width="1.5" />
      <!-- Blade Right -->
      <path d="M6, -10 C35, -28 48, 5 10, 22 L6, 12 Z" fill="url(#axeBlade)" stroke="#fee2e2" stroke-width="1.5" />
      <!-- Center ring -->
      <circle cx="0" cy="5" r="8" fill="url(#bronzeTrim)" stroke="#78350f" stroke-width="1.5" />
      <!-- Spike top -->
      <path d="M0, -22 L5, -8 L-5, -8 Z" fill="url(#bronzeTrim)" />
    </g>
    
    <!-- Right Axe Head -->
    <g transform="rotate(-45) translate(0, -45)">
      <!-- Blade Left -->
      <path d="M-6, -10 C-35, -28 -48, 5 -10, 22 L-6, 12 Z" fill="url(#axeBlade)" stroke="#fee2e2" stroke-width="1.5" />
      <!-- Blade Right -->
      <path d="M6, -10 C35, -28 48, 5 10, 22 L6, 12 Z" fill="url(#axeBlade)" stroke="#fee2e2" stroke-width="1.5" />
      <!-- Center ring -->
      <circle cx="0" cy="5" r="8" fill="url(#bronzeTrim)" stroke="#78350f" stroke-width="1.5" />
      <!-- Spike top -->
      <path d="M0, -22 L5, -8 L-5, -8 Z" fill="url(#bronzeTrim)" />
    </g>

    <!-- Center Horned Warrior Crest -->
    <circle cx="0" cy="0" r="22" fill="#2d0a0d" stroke="url(#bronzeTrim)" stroke-width="3" />
    <!-- Horned Mask / Skull silhouette -->
    <path d="M-10, -6 C-18, -20 -15, -26 -12, -26 C-10, -26 -6, -16 -4, -6 Z" fill="url(#bronzeTrim)" />
    <path d="M10, -6 C18, -20 15, -26 12, -26 C10, -26 6, -16 4, -6 Z" fill="url(#bronzeTrim)" />
    <circle cx="-6" cy="0" r="3.5" fill="#fca5a5" />
    <circle cx="6" cy="0" r="3.5" fill="#fca5a5" />
    <path d="M-5, 8 L5, 8 L0, 14 Z" fill="url(#bronzeTrim)" />
  </g>
</svg>
