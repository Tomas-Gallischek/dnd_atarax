<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="paladinBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="65%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="holyBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="crusaderGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="shieldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="palaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#paladinBg)" stroke="#fbbf24" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4" />

  <!-- Paladin Kite Shield & Holy Sun Sword -->
  <g transform="translate(100, 100)" filter="url(#palaGlow)">
    <!-- Light Radiance behind Shield -->
    <path d="M-60, -30 L60, 30 M-60, 30 L60, -30 M0, -65 L0, 65" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.3" />

    <!-- Upright Holy Longsword (behind shield) -->
    <!-- Blade tip sticking up -->
    <path d="M-4, -75 L0, -84 L4, -75 L4, -30 L-4, -30 Z" fill="url(#holyBlade)" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="-80" x2="0" y2="-30" stroke="#ffffff" stroke-width="1.5" />
    <!-- Crossguard top edge -->
    <rect x="-18" y="-32" width="36" height="6" rx="2" fill="url(#crusaderGold)" />
    <!-- Sword bottom tip sticking down -->
    <path d="M-3, 55 L3, 55 L0, 75 Z" fill="url(#holyBlade)" />

    <!-- Kite Shield in Foreground -->
    <path d="M-40, -32 L40, -32 C40, -32 42, 10 32, 38 C22, 60 0, 74 0, 74 C0, 74 -22, 60 -32, 38 C-42, 10 -40, -32 -40, -32 Z" fill="url(#shieldPlate)" stroke="url(#crusaderGold)" stroke-width="3.5" />

    <!-- Golden Crusader Cross on Shield -->
    <!-- Vertical Arm -->
    <path d="M-6, -26 L6, -26 L6, 52 L-6, 52 Z" fill="url(#crusaderGold)" stroke="#fef08a" stroke-width="1" />
    <!-- Horizontal Arm -->
    <path d="M-28, -12 L28, -12 L28, 0 L-28, 0 Z" fill="url(#crusaderGold)" stroke="#fef08a" stroke-width="1" />

    <!-- Divine Gem Center -->
    <polygon points="0,-10 7,-6 0,-2 -7,-6" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
    <circle cx="0" cy="-6" r="2.5" fill="#ffffff" />

    <!-- Shield Rivets -->
    <circle cx="-32" cy="-24" r="2" fill="#e2e8f0" />
    <circle cx="32" cy="-24" r="2" fill="#e2e8f0" />
    <circle cx="-25" cy="30" r="2" fill="#e2e8f0" />
    <circle cx="25" cy="30" r="2" fill="#e2e8f0" />
  </g>
</svg>
