<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="adventurerBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#44403c" />
      <stop offset="65%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </radialGradient>
    <linearGradient id="compassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="compassBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="advGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#adventurerBg)" stroke="#f59e0b" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4" />

  <!-- Adventurer's Compass Rose & Guiding Stars -->
  <g transform="translate(100, 100)" filter="url(#advGlow)">
    <!-- Outer Ring with Degree Marks -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="url(#compassGold)" stroke-width="2" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="#78350f" stroke-width="1" stroke-dasharray="3,3" />

    <!-- 4 Diagonal Points (Secondary) -->
    <polygon points="0,0 28,-28 10,-8" fill="url(#compassBronze)" />
    <polygon points="0,0 28,-28 8,-10" fill="url(#compassGold)" />

    <polygon points="0,0 28,28 10,8" fill="url(#compassBronze)" />
    <polygon points="0,0 28,28 8,10" fill="url(#compassGold)" />

    <polygon points="0,0 -28,28 -10,8" fill="url(#compassBronze)" />
    <polygon points="0,0 -28,28 -8,10" fill="url(#compassGold)" />

    <polygon points="0,0 -28,-28 -10,-8" fill="url(#compassBronze)" />
    <polygon points="0,0 -28,-28 -8,-10" fill="url(#compassGold)" />

    <!-- 4 Cardinal Points (Primary) -->
    <!-- North -->
    <polygon points="0,-64 0,0 -12,-16" fill="url(#compassBronze)" />
    <polygon points="0,-64 0,0 12,-16" fill="url(#compassGold)" />
    
    <!-- South -->
    <polygon points="0,64 0,0 12,16" fill="url(#compassBronze)" />
    <polygon points="0,64 0,0 -12,16" fill="url(#compassGold)" />

    <!-- East -->
    <polygon points="64,0 0,0 16,-12" fill="url(#compassBronze)" />
    <polygon points="64,0 0,0 16,12" fill="url(#compassGold)" />

    <!-- West -->
    <polygon points="-64,0 0,0 -16,12" fill="url(#compassBronze)" />
    <polygon points="-64,0 0,0 -16,-12" fill="url(#compassGold)" />

    <!-- Center Boss / Star Core -->
    <circle cx="0" cy="0" r="14" fill="#1c1917" stroke="url(#compassGold)" stroke-width="3" />
    <circle cx="0" cy="0" r="6" fill="#fef08a" />

    <!-- North Fleur-de-lis / Star Accent -->
    <circle cx="0" cy="-70" r="3" fill="#fef08a" />
  </g>
</svg>
