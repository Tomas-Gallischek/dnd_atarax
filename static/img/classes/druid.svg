<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="druidBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="70%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#02140a" />
    </radialGradient>
    <linearGradient id="natureGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="woodBark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="druidGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#druidBg)" stroke="#22c55e" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#86efac" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4" />

  <!-- Nature / Antlers & Oak Emblem -->
  <g transform="translate(100, 100)" filter="url(#druidGlow)">
    <!-- Crescent Moon in Center -->
    <path d="M-10, -45 C25, -45 42, -15 35, 20 C28, 55 -5, 65 -25, 60 C5, 52 20, 30 15, 5 C10, -20 -5, -40 -10, -45 Z" fill="#fef08a" opacity="0.35" />

    <!-- Left Antler -->
    <path d="M-8, 15 C-25, 5 -40, -10 -45, -35 C-42, -30 -35, -28 -30, -32 C-32, -45 -45, -60 -55, -68 C-50, -55 -48, -48 -45, -42 C-55, -48 -68, -42 -72, -38 C-65, -32 -55, -30 -48, -25 C-45, 0 -30, 25 -8, 35 Z" fill="url(#woodBark)" stroke="#451a03" stroke-width="1.5" />

    <!-- Right Antler -->
    <path d="M8, 15 C25, 5 40, -10 45, -35 C42, -30 35, -28 30, -32 C32, -45 45, -60 55, -68 C50, -55 48, -48 45, -42 C55, -48 68, -42 72, -38 C65, -32 55, -30 48, -25 C45, 0 30, 25 8, 35 Z" fill="url(#woodBark)" stroke="#451a03" stroke-width="1.5" />

    <!-- Central Oak Leaf -->
    <g transform="translate(0, 0) scale(1.15)">
      <!-- Leaf Silhouette -->
      <path d="M0, -42 C12, -36 15, -24 6, -18 C18, -12 20, 2 8, 8 C16, 16 12, 28 0, 38 C-12, 28 -16, 16 -8, 8 C-20, 2 -18, -12 -6, -18 C-15, -24 -12, -36 0, -42 Z" fill="url(#natureGreen)" stroke="#bbf7d0" stroke-width="2" />
      <!-- Central Leaf Vein -->
      <line x1="0" y1="-38" x2="0" y2="44" stroke="#14532d" stroke-width="2" />
      <!-- Side veins -->
      <line x1="0" y1="-25" x2="8" y2="-20" stroke="#14532d" stroke-width="1.5" />
      <line x1="0" y1="-25" x2="-8" y2="-20" stroke="#14532d" stroke-width="1.5" />
      <line x1="0" y1="-5" x2="10" y2="2" stroke="#14532d" stroke-width="1.5" />
      <line x1="0" y1="-5" x2="-10" y2="2" stroke="#14532d" stroke-width="1.5" />
      <line x1="0" y1="15" x2="8" y2="24" stroke="#14532d" stroke-width="1.5" />
      <line x1="0" y1="15" x2="-8" y2="24" stroke="#14532d" stroke-width="1.5" />
    </g>

    <!-- Triquetra / Wild Petals -->
    <circle cx="0" cy="50" r="4.5" fill="#facc15" />
    <circle cx="-25" cy="58" r="3.5" fill="#4ade80" />
    <circle cx="25" cy="58" r="3.5" fill="#4ade80" />
  </g>
</svg>
