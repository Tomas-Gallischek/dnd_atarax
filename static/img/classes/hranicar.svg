<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="rangerBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#143e26" />
      <stop offset="70%" stop-color="#0a2315" />
      <stop offset="100%" stop-color="#030d07" />
    </radialGradient>
    <linearGradient id="bowWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="50%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="arrowHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="rangerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#rangerBg)" stroke="#84cc16" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#a3e635" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4" />

  <!-- Ranger Longbow & Crossed Arrows -->
  <g transform="translate(100, 100)" filter="url(#rangerGlow)">
    <!-- Crossed Arrow 1 -->
    <g transform="rotate(40)">
      <line x1="0" y1="-65" x2="0" y2="65" stroke="#78350f" stroke-width="3" />
      <!-- Arrowhead -->
      <polygon points="0,-75 -8,-58 0,-62 8,-58" fill="url(#arrowHead)" stroke="#cbd5e1" stroke-width="1" />
      <!-- Fletching (Feathers) -->
      <path d="M-8,55 L0,48 L8,55 L8,68 L0,62 L-8,68 Z" fill="#84cc16" stroke="#4d7c0f" stroke-width="1" />
    </g>

    <!-- Crossed Arrow 2 -->
    <g transform="rotate(-40)">
      <line x1="0" y1="-65" x2="0" y2="65" stroke="#78350f" stroke-width="3" />
      <!-- Arrowhead -->
      <polygon points="0,-75 -8,-58 0,-62 8,-58" fill="url(#arrowHead)" stroke="#cbd5e1" stroke-width="1" />
      <!-- Fletching (Feathers) -->
      <path d="M-8,55 L0,48 L8,55 L8,68 L0,62 L-8,68 Z" fill="#84cc16" stroke="#4d7c0f" stroke-width="1" />
    </g>

    <!-- Upright Recurve Bow -->
    <!-- Bow Limb Left/Right Curve -->
    <path d="M0, -70 C-45, -45 -55, 0 -35, 40 C-30, 52 -20, 62 0, 70" fill="none" stroke="url(#bowWood)" stroke-width="6" stroke-linecap="round" />
    <!-- Bowstring -->
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="2,1" />

    <!-- Grip wrap in center -->
    <rect x="-35" y="-10" width="8" height="20" rx="3" fill="#1c1917" stroke="#78350f" stroke-width="1" transform="rotate(-10 -31 0)" />

    <!-- Center Hunter Emblem / Target -->
    <circle cx="0" cy="0" r="16" fill="#064e3b" stroke="#facc15" stroke-width="2.5" />
    <circle cx="0" cy="0" r="8" fill="none" stroke="#84cc16" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3" fill="#facc15" />
    <!-- Compass ticks -->
    <line x1="0" y1="-22" x2="0" y2="-17" stroke="#facc15" stroke-width="2" />
    <line x1="0" y1="17" x2="0" y2="22" stroke="#facc15" stroke-width="2" />
    <line x1="-22" y1="0" x2="-17" y2="0" stroke="#facc15" stroke-width="2" />
    <line x1="17" y1="0" x2="22" y2="0" stroke="#facc15" stroke-width="2" />
  </g>
</svg>
