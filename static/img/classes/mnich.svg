<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="monkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="65%" stop-color="#431407" />
      <stop offset="100%" stop-color="#140502" />
    </radialGradient>
    <linearGradient id="chiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="jadeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="monkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#monkBg)" stroke="#f97316" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#fdba74" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.4" />

  <!-- Chi Focus / Zen Yin-Yang & Lotus -->
  <g transform="translate(100, 100)" filter="url(#monkGlow)">
    <!-- Prayer Beads Ring (12 beads around) -->
    <g fill="#451a03" stroke="#f97316" stroke-width="1.5">
      <circle cx="0" cy="-62" r="5" fill="#10b981" />
      <circle cx="31" cy="-54" r="4.5" />
      <circle cx="54" cy="-31" r="4.5" />
      <circle cx="62" cy="0" r="5" fill="#facc15" />
      <circle cx="54" cy="31" r="4.5" />
      <circle cx="31" cy="54" r="4.5" />
      <circle cx="0" cy="62" r="5" fill="#10b981" />
      <circle cx="-31" cy="54" r="4.5" />
      <circle cx="-54" cy="31" r="4.5" />
      <circle cx="-62" cy="0" r="5" fill="#facc15" />
      <circle cx="-54" cy="-31" r="4.5" />
      <circle cx="-31" cy="-54" r="4.5" />
    </g>

    <!-- Outer Chi Disc -->
    <circle cx="0" cy="0" r="45" fill="#270c06" stroke="url(#chiGlow)" stroke-width="3" />

    <!-- Stylized Yin-Yang Chi Curve -->
    <path d="M0, -42 A42,42 0 0,1 0,42 A21,21 0 0,1 0,0 A21,21 0 0,0 0,-42 Z" fill="url(#chiGlow)" />
    <!-- Yang Dot -->
    <circle cx="0" cy="-21" r="6.5" fill="#270c06" stroke="#f97316" stroke-width="1" />
    <!-- Yin Dot -->
    <circle cx="0" cy="21" r="6.5" fill="url(#jadeAccent)" stroke="#ffffff" stroke-width="1" />

    <!-- Lotus Petals at Bottom -->
    <path d="M0, 32 C12, 18 28, 25 24, 45 C15, 48 0, 48 0, 48 Z" fill="url(#jadeAccent)" opacity="0.8" />
    <path d="M0, 32 C-12, 18 -28, 25 -24, 45 C-15, 48 0, 48 0, 48 Z" fill="url(#jadeAccent)" opacity="0.8" />
    <path d="M0, 24 C8, 32 8, 44 0, 52 C-8, 44 -8, 32 0, 24 Z" fill="#fef08a" />
  </g>
</svg>
