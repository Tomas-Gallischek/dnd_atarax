<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="fighterBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="steelBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldHilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="fighterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#fighterBg)" stroke="#38bdf8" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />

  <!-- Crossed Swords and Shield -->
  <g transform="translate(100, 100)" filter="url(#fighterGlow)">
    <!-- Sword 1 -->
    <g transform="rotate(45)">
      <!-- Blade -->
      <path d="M-4, -65 L0, -78 L4, -65 L4, 30 L-4, 30 Z" fill="url(#steelBlade)" stroke="#e2e8f0" stroke-width="1" />
      <!-- Fuller / Blood Groove -->
      <line x1="0" y1="-65" x2="0" y2="25" stroke="#334155" stroke-width="1.5" />
      <!-- Crossguard -->
      <rect x="-18" y="30" width="36" height="7" rx="3" fill="url(#goldHilt)" stroke="#713f12" stroke-width="1" />
      <!-- Grip -->
      <rect x="-4" y="37" width="8" height="25" rx="2" fill="#451a03" stroke="#1c1917" stroke-width="1" />
      <!-- Pommel -->
      <circle cx="0" cy="66" r="6" fill="url(#goldHilt)" stroke="#713f12" stroke-width="1" />
    </g>

    <!-- Sword 2 -->
    <g transform="rotate(-45)">
      <!-- Blade -->
      <path d="M-4, -65 L0, -78 L4, -65 L4, 30 L-4, 30 Z" fill="url(#steelBlade)" stroke="#e2e8f0" stroke-width="1" />
      <!-- Fuller / Blood Groove -->
      <line x1="0" y1="-65" x2="0" y2="25" stroke="#334155" stroke-width="1.5" />
      <!-- Crossguard -->
      <rect x="-18" y="30" width="36" height="7" rx="3" fill="url(#goldHilt)" stroke="#713f12" stroke-width="1" />
      <!-- Grip -->
      <rect x="-4" y="37" width="8" height="25" rx="2" fill="#451a03" stroke="#1c1917" stroke-width="1" />
      <!-- Pommel -->
      <circle cx="0" cy="66" r="6" fill="url(#goldHilt)" stroke="#713f12" stroke-width="1" />
    </g>

    <!-- Heater Shield in Center -->
    <path d="M-36, -35 L36, -35 L34, 15 C30, 48 0, 68 0, 68 C0, 68 -30, 48 -34, 15 Z" fill="url(#shieldGrad)" stroke="url(#goldHilt)" stroke-width="3" />
    <!-- Shield Rim Detail -->
    <path d="M-28, -27 L28, -27 L26, 12 C23, 40 0, 56 0, 56 C0, 56 -23, 40 -26, 12 Z" fill="none" stroke="#64748b" stroke-width="1.5" />
    
    <!-- Helmet / Emblem on Shield -->
    <g transform="translate(0, 5)">
      <!-- Helm Dome -->
      <path d="M-16, -18 C-16, -32 16, -32 16, -18 L16, 8 L-16, 8 Z" fill="url(#steelBlade)" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Visor T-slit -->
      <rect x="-12" y="-10" width="24" height="4" rx="1" fill="#0f172a" />
      <rect x="-2" y="-10" width="4" height="15" rx="1" fill="#0f172a" />
      <!-- Helm Crest plume -->
      <path d="M-3, -32 Q0, -42 6, -42 Q4, -34 3, -32 Z" fill="#eab308" />
      <!-- Rivets -->
      <circle cx="-12" cy="4" r="1.5" fill="#f8fafc" />
      <circle cx="12" cy="4" r="1.5" fill="#f8fafc" />
    </g>
  </g>
</svg>
