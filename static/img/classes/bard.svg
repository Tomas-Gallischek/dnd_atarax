<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="70%" stop-color="#1e0438" />
      <stop offset="100%" stop-color="#090114" />
    </radialGradient>
    <linearGradient id="luteBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="magicNotes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="bardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bardBg)" stroke="#c084fc" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="3,5" opacity="0.5" />
  
  <!-- Lute and Musical Swirls -->
  <g transform="translate(100, 100)" filter="url(#bardGlow)">
    <!-- Arcane Sound Waves / Notes -->
    <path d="M-60, 20 C-40, -60 40, -60 60, -20" fill="none" stroke="url(#magicNotes)" stroke-width="3" stroke-dasharray="6,4" />
    <!-- Music notes -->
    <g transform="translate(-45, -35) scale(0.9)">
      <circle cx="0" cy="0" r="5" fill="#f472b6" />
      <path d="M4, 0 L4, -20 L16, -16 L16, 2" fill="none" stroke="#f472b6" stroke-width="2" />
      <circle cx="12" cy="2" r="5" fill="#f472b6" />
    </g>
    <g transform="translate(45, -40) scale(0.8) rotate(15)">
      <circle cx="0" cy="0" r="5" fill="#c084fc" />
      <path d="M4, 0 L4, -22 C14, -20 18, -12 18, -12" fill="none" stroke="#c084fc" stroke-width="2.5" />
    </g>
    
    <!-- Lute tilted -->
    <g transform="rotate(-30)">
      <!-- Neck -->
      <rect x="-5" y="-65" width="10" height="75" rx="3" fill="#92400e" stroke="#451a03" stroke-width="1.5" />
      <!-- Head / Pegbox -->
      <path d="M-8, -65 L8, -65 L6, -82 L-6, -82 Z" fill="#78350f" stroke="#451a03" stroke-width="1.5" />
      <!-- Tuning Pegs -->
      <circle cx="-10" cy="-76" r="2.5" fill="#fbbf24" />
      <circle cx="10" cy="-76" r="2.5" fill="#fbbf24" />
      <circle cx="-10" cy="-70" r="2.5" fill="#fbbf24" />
      <circle cx="10" cy="-70" r="2.5" fill="#fbbf24" />
      <!-- Strings -->
      <line x1="-2" y1="-75" x2="-2" y2="40" stroke="#fef08a" stroke-width="1" />
      <line x1="0" y1="-75" x2="0" y2="40" stroke="#fef08a" stroke-width="1" />
      <line x1="2" y1="-75" x2="2" y2="40" stroke="#fef08a" stroke-width="1" />
      <!-- Body (Pear shape) -->
      <path d="M0, -5 C25, -5 45, 25 40, 52 C35, 75 0, 78 0, 78 C0, 78 -35, 75 -40, 52 C-45, 25 -25, -5 0, -5 Z" fill="url(#luteBody)" stroke="#fef08a" stroke-width="2" />
      <!-- Sound Hole (Rose) -->
      <circle cx="0" cy="25" r="12" fill="#180b05" stroke="#f59e0b" stroke-width="2" />
      <circle cx="0" cy="25" r="7" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2,2" />
      <!-- Bridge -->
      <rect x="-14" y="55" width="28" height="6" rx="2" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
    </g>

    <!-- Sparkles / Inspiration -->
    <path d="M-30, 45 L-26, 35 L-22, 45 L-12, 49 L-22, 53 L-26, 63 L-30, 53 L-40, 49 Z" fill="#fef08a" />
    <path d="M35, 30 L38, 22 L41, 30 L49, 33 L41, 36 L38, 44 L35, 36 L27, 33 Z" fill="#f472b6" />
  </g>
</svg>
