<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="wizardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="65%" stop-color="#0b0e2b" />
      <stop offset="100%" stop-color="#030412" />
    </radialGradient>
    <linearGradient id="grimoireCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="spellPages" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="magicRune" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="wizGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#wizardBg)" stroke="#38bdf8" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4" />

  <!-- Open Grimoire and Arcane Star -->
  <g transform="translate(100, 100)" filter="url(#wizGlow)">
    <!-- Arcane Halo of Stars / Glyphs -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2,6" opacity="0.6" />
    
    <!-- Open Book Cover (Backing) -->
    <path d="M-60, 20 C-30, 15 -10, 25 0, 30 C10, 25 30, 15 60, 20 L55, -28 C30, -32 10, -22 0, -18 C-10, -22 -30, -32 -55, -28 Z" fill="url(#grimoireCover)" stroke="#facc15" stroke-width="2.5" />

    <!-- Left Book Page -->
    <path d="M-52, 14 C-28, 9 -10, 18 0, 24 L0, -22 C-10, -28 -28, -38 -52, -32 Z" fill="url(#spellPages)" stroke="#93c5fd" stroke-width="1" />
    <!-- Right Book Page -->
    <path d="M52, 14 C28, 9 10, 18 0, 24 L0, -22 C10, -28 28, -38 52, -32 Z" fill="url(#spellPages)" stroke="#93c5fd" stroke-width="1" />

    <!-- Page Text Lines (Runes) -->
    <line x1="-42" y1="-18" x2="-10" y2="-12" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
    <line x1="-42" y1="-8" x2="-10" y2="-2" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
    <line x1="-42" y1="2" x2="-14" y2="8" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />

    <line x1="10" y1="-12" x2="42" y2="-18" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="-2" x2="42" y2="-8" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
    <line x1="14" y1="8" x2="42" y2="2" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />

    <!-- Floating Arcane Glyph / Octagram Rising above book -->
    <g transform="translate(0, -42)">
      <polygon points="0,-18 13,-13 18,0 13,13 0,18 -13,13 -18,0 -13,-13" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" />
      <polygon points="0,-14 10,-10 14,0 10,10 0,14 -10,10 -14,0 -10,-10" fill="url(#magicRune)" />
      <!-- Core Star -->
      <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
      <!-- Rising Sparks -->
      <line x1="0" y1="-24" x2="0" y2="-30" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
      <line x1="-20" y1="-15" x2="-26" y2="-19" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="20" y1="-15" x2="26" y2="-19" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Bookmark Ribbon -->
    <path d="M0, 24 L0, 48 L-5, 42 L-10, 48 L-10, 22 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1" />
  </g>
</svg>
