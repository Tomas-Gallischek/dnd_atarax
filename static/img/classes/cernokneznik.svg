<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="warlockBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#010f0b" />
    </radialGradient>
    <radialGradient id="patronEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="85%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <linearGradient id="eldritchRays" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="warlockGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#warlockBg)" stroke="#10b981" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.4" />

  <!-- Eldritch Occult Eye & Sigils -->
  <g transform="translate(100, 100)" filter="url(#warlockGlow)">
    <!-- Pentagram / Pact Rune Circle -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="#059669" stroke-width="2" />
    <polygon points="0,-56 53,17 -33,45 -33,-45 53,-17" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5" />
    <polygon points="0,-56 -53,17 33,45 33,-45 -53,-17" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5" />

    <!-- Eldritch Tentacles / Horns framing -->
    <path d="M-40, 20 C-60, -10 -65, -45 -45, -60 C-48, -40 -40, -15 -25, 5 Z" fill="url(#eldritchRays)" opacity="0.8" />
    <path d="M40, 20 C60, -10 65, -45 45, -60 C48, -40 40, -15 25, 5 Z" fill="url(#eldritchRays)" opacity="0.8" />
    <path d="M-25, 45 C-45, 60 -15, 75 -5, 65 C-15, 62 -28, 55 -20, 40 Z" fill="url(#eldritchRays)" opacity="0.7" />
    <path d="M25, 45 C45, 60 15, 75 5, 65 C15, 62 28, 55 20, 40 Z" fill="url(#eldritchRays)" opacity="0.7" />

    <!-- The Great Other Eye (Almond Outer) -->
    <path d="M-50, 0 C-30, -32 30, -32 50, 0 C30, 32 -30, 32 -50, 0 Z" fill="#021c16" stroke="#34d399" stroke-width="3" />

    <!-- Iris -->
    <circle cx="0" cy="0" r="22" fill="url(#patronEye)" stroke="#a7f3d0" stroke-width="2" />

    <!-- Goat / Eldritch Slit Pupil -->
    <rect x="-3" y="-18" width="6" height="36" rx="2" fill="#020d09" transform="rotate(10)" />
    <!-- Pupil Highlight -->
    <circle cx="-6" cy="-6" r="3.5" fill="#ecfdf5" />
  </g>
</svg>
