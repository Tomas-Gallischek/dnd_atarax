<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="npcBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d2238" />
      <stop offset="65%" stop-color="#171220" />
      <stop offset="100%" stop-color="#0c0910" />
    </radialGradient>
    <linearGradient id="npcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="npcHood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3b5a" />
      <stop offset="60%" stop-color="#261c33" />
      <stop offset="100%" stop-color="#150f1d" />
    </linearGradient>
    <linearGradient id="npcFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#120e18" />
      <stop offset="100%" stop-color="#08060b" />
    </linearGradient>
    <filter id="npcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="100" cy="100" r="96" fill="url(#npcBg)" stroke="url(#npcGold)" stroke-width="3.5" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.45" />

  <!-- Cloaked Mystical Figure (NPC Silhouette) -->
  <g id="npcFigure" filter="url(#npcGlow)">
    <!-- Shoulders & Cloak Mantle -->
    <path d="M 38 184 C 42 144, 62 124, 76 114 C 84 122, 116 122, 124 114 C 138 124, 158 144, 162 184 Z" fill="url(#npcHood)" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Hood Outer -->
    <path d="M 64 120 C 56 94, 66 52, 100 40 C 134 52, 144 94, 136 120 C 126 128, 114 132, 100 132 C 86 132, 74 128, 64 120 Z" fill="url(#npcHood)" stroke="url(#npcGold)" stroke-width="2" />

    <!-- Hood Inner Shadow / Face Void -->
    <path d="M 74 112 C 68 90, 78 64, 100 56 C 122 64, 132 90, 126 112 C 118 120, 108 122, 100 122 C 92 122, 82 120, 74 112 Z" fill="url(#npcFace)" stroke="#1a1424" stroke-width="1" />

    <!-- Mysterious Glowing Eyes -->
    <circle cx="89" cy="88" r="3.2" fill="#fef08a" opacity="0.9" />
    <circle cx="89" cy="88" r="1.5" fill="#ffffff" />
    <circle cx="111" cy="88" r="3.2" fill="#fef08a" opacity="0.9" />
    <circle cx="111" cy="88" r="1.5" fill="#ffffff" />

    <!-- Cloak Brooch / Medallion -->
    <polygon points="100,126 107,135 100,144 93,135" fill="url(#npcGold)" />
    <circle cx="100" cy="135" r="2.2" fill="#fef08a" />
  </g>

  <!-- Decorative Runes & Stars -->
  <circle cx="100" cy="20" r="3" fill="#f59e0b" opacity="0.8" />
  <circle cx="20" cy="100" r="3" fill="#f59e0b" opacity="0.8" />
  <circle cx="180" cy="100" r="3" fill="#f59e0b" opacity="0.8" />
  <circle cx="100" cy="180" r="3" fill="#f59e0b" opacity="0.8" />
</svg>
