  <polygon points="78,60 66,63 66,67 78,65" fill="#ef4444" filter="url(#ssGlow)"/>
  <!-- Mouth grille -->
  <line x1="56" y1="74" x2="56" y2="82" stroke="#ef4444" stroke-width="2"/>
  <line x1="64" y1="74" x2="64" y2="84" stroke="#ef4444" stroke-width="2"/>
  <line x1="72" y1="74" x2="72" y2="82" stroke="#ef4444" stroke-width="2"/>
</svg>