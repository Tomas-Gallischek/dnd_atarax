<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="ssBg" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="100%" stop-color="#0f0303"/>
    </radialGradient>
    <linearGradient id="ssBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="ssGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="58" fill="url(#ssBg)" stroke="#ef4444" stroke-width="3.5"/>
  <!-- Crossed Battle Axes -->
  <line x1="24" y1="104" x2="104" y2="24" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
  <line x1="104" y1="104" x2="24" y2="24" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
  <!-- Left axe blade -->
  <path d="M26 28 C34 16 52 24 50 44 C42 42 34 38 26 28 Z" fill="url(#ssBlade)" stroke="#ef4444" stroke-width="1.5"/>
  <!-- Right axe blade -->
  <path d="M102 28 C94 16 76 24 78 44 C86 42 94 38 102 28 Z" fill="url(#ssBlade)" stroke="#ef4444" stroke-width="1.5"/>
  <!-- Heavy Armored Skull Helmet -->
  <path d="M46 54 C46 36 82 36 82 54 L84 76 C84 88 44 88 44 76 Z" fill="#334155" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Horns -->
  <path d="M46 52 C32 46 28 32 30 24 C34 36 44 44 48 50 Z" fill="#cbd5e1"/>
  <path d="M82 52 C96 46 100 32 98 24 C94 36 84 44 80 50 Z" fill="#cbd5e1"/>
