<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="locBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b2d1f" />
      <stop offset="65%" stop-color="#241a12" />
      <stop offset="100%" stop-color="#140d08" />
    </radialGradient>
    <linearGradient id="mapGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78593a" />
      <stop offset="50%" stop-color="#543c24" />
      <stop offset="100%" stop-color="#362514" />
    </linearGradient>
    <filter id="locGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#locBg)" stroke="url(#mapGold)" stroke-width="3.5" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.4" />

  <!-- Parchment Map Scroll Icon -->
  <g id="mapIcon" filter="url(#locGlow)">
    <!-- Map Canvas / Unfurled Scroll -->
    <rect x="42" y="44" width="116" height="112" rx="10" fill="url(#parchment)" stroke="url(#mapGold)" stroke-width="2" />
    <path d="M 46 64 C 70 68, 130 60, 154 64" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <path d="M 46 136 C 80 132, 120 140, 154 136" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

    <!-- Mountain Peaks on the Map -->
    <polygon points="56,128 72,94 88,128" fill="#2d1e11" stroke="#f59e0b" stroke-width="1.5" />
    <polygon points="80,128 98,84 116,128" fill="#22160a" stroke="url(#mapGold)" stroke-width="2" />
    <polygon points="108,128 126,98 144,128" fill="#2d1e11" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Mountain Snow Caps -->
    <polygon points="98,84 92,98 98,95 104,98" fill="#fef08a" />
    <polygon points="72,94 67,104 72,102 77,104" fill="#fef08a" opacity="0.8" />
    <polygon points="126,98 122,107 126,105 130,107" fill="#fef08a" opacity="0.8" />

    <!-- Castle Tower / Stronghold Marker -->
    <g transform="translate(126, 68)">
      <rect x="-8" y="0" width="16" height="18" fill="#140d08" stroke="#f59e0b" stroke-width="1.2" />
      <polygon points="-10,0 -8,-7 -4,0 0,-7 4,0 8,-7 10,0" fill="#f59e0b" />
      <rect x="-2" y="8" width="4" height="10" rx="2" fill="#fef08a" />
    </g>

    <!-- Mini Cartographer Compass Rose in top-left -->
    <g transform="translate(68, 68)">
      <circle cx="0" cy="0" r="14" fill="#1c130b" stroke="#f59e0b" stroke-width="1.2" />
      <polygon points="0,-12 3,0 0,2 -3,0" fill="#fef08a" />
      <polygon points="0,12 3,0 0,-2 -3,0" fill="#b45309" />
      <polygon points="12,0 0,3 -2,0 0,-3" fill="#f59e0b" />
      <polygon points="-12,0 0,3 2,0 0,-3" fill="#d97706" />
      <circle cx="0" cy="0" r="2.5" fill="#fef08a" />
    </g>

    <!-- Map pin / Waypoint destination -->
    <g transform="translate(100, 134)">
      <circle cx="0" cy="0" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>

    <!-- Dashed Travel Path -->
    <path d="M 72 74 Q 90 90, 100 128" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" />
  </g>

  <!-- Cardinal points markers on frame -->
  <circle cx="100" cy="18" r="3" fill="#f59e0b" />
  <circle cx="100" cy="182" r="3" fill="#f59e0b" />
  <circle cx="18" cy="100" r="3" fill="#f59e0b" />
  <circle cx="182" cy="100" r="3" fill="#f59e0b" />
</svg>
