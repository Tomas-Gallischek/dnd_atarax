  <path d="M88 32 C88 24 100 24 100 32 L100 88 C100 96 88 96 88 88 Z" fill="#d97706"/>
  <!-- Scroll runes/lines -->
  <line x1="52" y1="40" x2="80" y2="40" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="50" x2="74" y2="50" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="60" x2="82" y2="60" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="70" x2="68" y2="70" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  <!-- Magic Feather Quill -->
  <path d="M86 16 C86 28 74 54 62 82 L58 84 L64 74 C72 50 86 30 86 16 Z" fill="url(#stvGold)" filter="url(#stvGlow)"/>
  <circle cx="58" cy="84" r="3" fill="#38bdf8" filter="url(#stvGlow)"/>
  <!-- Sparkles -->
  <polygon points="32,24 34,29 39,30 34,32 32,37 30,32 25,30 30,29" fill="#38bdf8" filter="url(#stvGlow)"/>
  <polygon points="96,78 98,82 102,83 98,85 96,89 94,85 90,83 94,82" fill="#fde047" filter="url(#stvGlow)"/>
