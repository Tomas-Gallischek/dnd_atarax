<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="zbBg" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#362208"/>
      <stop offset="100%" stop-color="#140c03"/>
    </radialGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="zbGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#zbBg)" stroke="url(#goldCoin)" stroke-width="3.5"/>
  <!-- Gold Sack -->
  <path d="M42 46 C42 36 86 36 86 46 C92 56 96 86 86 98 C78 104 50 104 42 98 C32 86 36 56 42 46 Z" fill="#92400e" stroke="url(#goldCoin)" stroke-width="2.5"/>
  <!-- Sack rope tie -->
  <rect x="48" y="44" width="32" height="6" rx="3" fill="url(#goldCoin)"/>
  <!-- Huge pile of shiny coins in front -->
  <ellipse cx="64" cy="98" rx="28" ry="8" fill="url(#goldCoin)" stroke="#78350f" stroke-width="1.5"/>
  <ellipse cx="44" cy="94" rx="14" ry="5" fill="url(#goldCoin)" stroke="#78350f" stroke-width="1.5"/>
  <ellipse cx="84" cy="94" rx="14" ry="5" fill="url(#goldCoin)" stroke="#78350f" stroke-width="1.5"/>
  <ellipse cx="54" cy="88" rx="12" ry="5" fill="url(#goldCoin)" stroke="#78350f" stroke-width="1.5"/>
  <ellipse cx="74" cy="88" rx="12" ry="5" fill="url(#goldCoin)" stroke="#78350f" stroke-width="1.5"/>
  <!-- Giant Gold Crown Coin on Sack -->
  <circle cx="64" cy="70" r="14" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" filter="url(#zbGlow)"/>
  <text x="64" y="76" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="900" fill="#78350f" text-anchor="middle">GP</text>
  <!-- Sparkling diamonds -->
  <polygon points="32,32 36,38 32,44 28,38" fill="#38bdf8" filter="url(#zbGlow)"/>
  <polygon points="98,40 102,46 98,52 94,46" fill="#34d399" filter="url(#zbGlow)"/>
</svg>