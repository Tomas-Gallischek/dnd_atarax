services:
  db:
    image: postgres:16-alpine
    container_name: dnd_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - dnd_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

web:
    build: .
    container_name: dnd_django
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "9000:8000"
    environment:
      - DB_ENGINE=${DB_ENGINE}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
    depends_on:
      - db

volumes:
  dnd_db_data:
