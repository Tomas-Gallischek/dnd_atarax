services:
  db:
    image: postgres:16-alpine
    container_name: dnd_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - dnd_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: dnd_django
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "9000:8000"
    environment:
      - DB_ENGINE=${DB_ENGINE}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
    depends_on:
      - db
    volumes:
      - ./media:/app/media

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=eyJhIjoiNjYxYzQ4MjIwNWI2MzJjNjA5MTIwYjBhOTMxOThmNTgiLCJ0IjoiNzBiNTQzMDEtMzk1Yi00ODMwLTkyNjEtODRkYzRmOGU0ZmI4IiwicyI6Ik9HSmtaREJoTlRZdFlXWXhOeTAwTmpnM0xUZzVNVGN0TkdWak1UbGlNR015T1RjMFlqWTNOVEF3Wm1JdFpqQm1OeTAwTkRrNUxXRTRaVFl0TnpGbE4yUXlPREZqTWpBdyJ9
    depends_on:
      - web

volumes:
  dnd_db_data:
