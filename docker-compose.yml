services:
  db:
    image: postgres:16-alpine
    container_name: dnd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Zde se definuje vyhrazené volume pro perzistenci databáze
    volumes:
      - dnd_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: dnd_django
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    # Propojení tvého lokálního kódu s kontejnerem (live-reload při vývoji)
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    # Načtení proměnných prostředí ze souboru .env
    env_file:
      - .env
    depends_on:
      - db

volumes:
  # Fyzické vytvoření persistentního volume na hostitelském serveru
  dnd_db_data:
