{% extends "base.html" %}

{% block title %}DnD Atarax - DM sekce{% endblock %}

{% block content %}

<h1>Správa zlaťáků</h1>

{% for char in all_chars %}
    <div class="char">
        <h2>{{ char.name }}</h2>
        <p><strong>Hráč:</strong> {{ char.player.nickname }}</p>
        <p><strong>Měna:</strong> {{ char.gold }} zlaťáků, {{ char.silver }} stříbrňáků</p>
    </div> 
{% endfor %}

{% endblock %}
